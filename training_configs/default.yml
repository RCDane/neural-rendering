run_name: default_experiment
batch_size: 5000
importance_epochs: 20000
decoder_epochs: 5000
texture_epochs: 10000
learning_rate: 0.001
weight_decay: 1e-6
num_workers: 8
hidden_dim: 64
render_every: 100000
print_every: 1000

networks:
  encoder:
    layers:
      - Linear: [8, 64]
      - ReLU: []
      - Linear: [64, 64]
      - ReLU: []
      - Linear: [64, 64]
      - ReLU: []
      - Linear: [64, 8]
  shading_frame:
    layers:
      - Linear: [8, 12]
  bsdf:
    layers:
      - Linear: [14, 32]
      - ReLU: []
      - Linear: [32, 32]
      - ReLU: []
      - Linear: [32, 32]
      - ReLU: []
      - Linear: [32, 3]
      - Exp: []